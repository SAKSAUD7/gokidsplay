# Background jobs for the live site (apps/core/cron_views.py):
#   every 15 minutes — release unpaid online bookings, re-check SumUp payments
#   daily 06:00 UTC  — refresh Google reviews and photos, thank-you e-mails, tomorrow's reminders
# Needs: secret CRON_SECRET (same value as the backend app setting CRON_SECRET)
#        variable BACKEND_URL (e.g. https://api.gokidsplay.co.uk)
name: Scheduled jobs

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'frequent or daily'
        default: 'frequent'

jobs:
  run:
    runs-on: ubuntu-latest
    if: vars.BACKEND_URL != ''
    steps:
      - name: Run jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || (github.event.schedule == '0 6 * * *' && 'daily' || 'frequent') }}
        run: |
          # Tidy the address (a pasted space or line break made curl fail with "malformed URL")
          BASE=$(printf '%s' "$BACKEND_URL" | tr -d '[:space:]')
          BASE=${BASE%/}
          SECRET=$(printf '%s' "$CRON_SECRET" | tr -d '[:space:]')
          case "$BASE" in https://*) ;; *) echo "::error::GitHub variable BACKEND_URL must start with https:// (it is '$BASE')"; exit 1;; esac
          [ -n "$SECRET" ] || { echo "::error::GitHub secret CRON_SECRET is missing"; exit 1; }
          echo "Running '$JOB' jobs on $BASE"
          curl -fsS --max-time 120 -X POST -H "X-Cron-Secret: $SECRET" "$BASE/api/v1/core/cron/?job=$JOB"
          echo
