# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - spinpin-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          cd frontend
          npm run build --if-present
          
          # Prepare standalone directory for deployment
          cp -r public .next/standalone/frontend/public
          cp -r .next/static .next/standalone/frontend/.next/static
          
          # Create a root server.js to start the frontend server in the standalone context
          echo "const PORT = process.env.PORT || 8080;" > .next/standalone/server.js
          echo "process.env.PORT = PORT;" >> .next/standalone/server.js
          echo "process.env.HOSTNAME = '0.0.0.0';" >> .next/standalone/server.js
          echo "require('./frontend/server.js');" >> .next/standalone/server.js
          
          cd .next/standalone
          zip -r ../../../deployment.zip .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2127EDA8C85A4A2A9532FEA90E615AFD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_478844F9A8ED415A9BC43B1D93D9E522 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_52B2BB8C9ABB4DEDB0199C54E0D8E6F9 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'spinpin-frontend'
          slot-name: 'Production'
          package: deployment.zip