# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - spinpin-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel any in-progress deployment to avoid 409 Conflict errors on Azure
concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      - name: Create and Start virtual environment and Install dependencies
        run: |
          cd backend
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C2A7ABC8580A4E6FB722960AF4C99905 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B2A789ECB355459E903A6B0241C9B0FB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42475C034FE54FA595735BC91F8FF60B }}

      - name: Stop Azure Web App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='spinpin-backend-cfgcejczfpgyabd7'].resourceGroup" -o tsv 2>/dev/null || az webapp list --query "[?name=='spinpin-backend'].resourceGroup" -o tsv)
            echo "Found Resource Group: $RG"
            az webapp stop --name spinpin-backend --resource-group $RG || true
            echo "Waiting 15s for app to fully stop..."
            sleep 15

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'spinpin-backend'
          slot-name: 'Production'

      - name: Start Azure Web App
        if: always()
        uses: azure/CLI@v2
        with:
          inlineScript: |
            RG=$(az webapp list --query "[?name=='spinpin-backend'].resourceGroup" -o tsv)
            az webapp start --name spinpin-backend --resource-group $RG