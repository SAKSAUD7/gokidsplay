<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ headline }}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;">
      <tr><td style="background:#0f172a;padding:18px 24px;">
        <p style="margin:0;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#94a3b8;">Go Kids Play · {{ kind_label }}</p>
        <h1 style="margin:4px 0 0;font-size:20px;color:#ffffff;">{{ headline }}</h1>
      </td></tr>
      <tr><td style="padding:20px 24px;">
        <table width="100%" cellpadding="0" cellspacing="0">
          {% for label, value in rows %}
          <tr>
            <td style="padding:7px 0;font-size:14px;color:#64748b;width:38%;vertical-align:top;">{{ label }}</td>
            <td style="padding:7px 0;font-size:14px;color:#0f172a;font-weight:600;">{{ value|default:"—"|linebreaksbr }}</td>
          </tr>
          {% endfor %}
        </table>
        {% if admin_url %}
        <p style="margin:22px 0 4px;"><a href="{{ admin_url }}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:700;font-size:14px;padding:10px 20px;border-radius:6px;">Open in the admin portal</a></p>
        {% endif %}
        <p style="margin:14px 0 0;font-size:12px;color:#94a3b8;">Press Reply to e-mail the customer directly.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
