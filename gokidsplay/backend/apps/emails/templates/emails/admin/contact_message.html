<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Contact Message — Go Kids Play Admin</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:'Segoe UI',Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:40px 20px;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;overflow:hidden;">
      
      <tr><td style="background:#1e293b;padding:20px 30px;text-align:center;">
        <h1 style="margin:0;color:#ffffff;font-size:20px;">🚨 New Contact Message</h1>
      </td></tr>
      
      <tr><td style="padding:30px;">
        <p style="margin:0 0 15px;font-size:15px;color:#334155;"><strong>From:</strong> {{ contact_message.name }}</p>
        <p style="margin:0 0 15px;font-size:15px;color:#334155;"><strong>Email:</strong> <a href="mailto:{{ contact_message.email }}">{{ contact_message.email }}</a></p>
        <p style="margin:0 0 25px;font-size:15px;color:#334155;"><strong>Phone:</strong> {{ contact_message.phone|default:"Not provided" }}</p>

        <div style="background:#f1f5f9;padding:20px;border-radius:6px;border-left:4px solid #3b82f6;">
          <p style="margin:0 0 10px;font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;">Subject: {{ contact_message.subject }}</p>
          <p style="margin:0;font-size:15px;color:#1e293b;line-height:1.6;">{{ contact_message.message|linebreaksbr }}</p>
        </div>
      </td></tr>

      <tr><td style="background:#f8fafc;padding:15px 30px;text-align:center;border-top:1px solid #e2e8f0;">
        <p style="margin:0;font-size:12px;color:#64748b;">Spin Pin Management Portal</p>
      </td></tr>

    </table>
  </td></tr>
</table>
</body>
</html>
