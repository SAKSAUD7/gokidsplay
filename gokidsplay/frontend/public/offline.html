<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0118">
    <title>You're offline · Go Kids Play</title>
    <link rel="icon" href="/favicon.png">
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background: radial-gradient(circle at 50% 0%, #2b0d55 0%, #0a0118 60%); color: #fff;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        main { max-width: 420px; }
        img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 40px rgba(245, 158, 11, .25); }
        h1 { font-size: 1.6rem; margin: 24px 0 8px; }
        p { color: rgba(255, 255, 255, .75); line-height: 1.5; margin: 0 0 24px; }
        button, a.call { display: inline-block; font: inherit; font-weight: 700; border: 0; border-radius: 14px;
               padding: 14px 22px; margin: 6px; cursor: pointer; text-decoration: none; }
        button { background: #ec4899; color: #fff; }
        a.call { background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid rgba(255, 255, 255, .2); }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="Go Kids Play">
    <h1>You're offline</h1>
    <p>We can't reach Go Kids Play right now. Check your Wi-Fi or mobile data, then try again.
       Bookings and prices need a connection so they're always up to date.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a class="call" href="tel:+447349110865">Call us</a>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
